name: Instagram投稿を制作

on:
  workflow_dispatch:
    inputs:
      format:
        description: "投稿形式（reel = 静止画1枚の10秒リール / feed = 1080×1350 / carousel = 複数枚）"
        type: choice
        options: [reel, feed, carousel]
        default: reel
      design:
        description: "デザイン（auto = テーマに合わせて自動選択）"
        type: choice
        options: [auto, A, B, C, D]
        default: auto
      mode:
        description: "auto = APIキーがあれば本番 / mock = 無料のテスト制作"
        type: choice
        options: [auto, mock]
        default: auto
      topic:
        description: "テーマ指定（空欄ならAIにおまかせ）例: 英語、夏休み"
        required: false
        default: ""
      preview_all:
        description: "A〜Dすべてのデザインで試作したプレビューも作る"
        type: boolean
        default: false
      save_history:
        description: "企画履歴・キャラ素材をリポジトリに保存する（重複防止のため推奨）"
        type: boolean
        default: true
  # 週3回（月・水・金 18:00 JST）に自動実行したい場合は、下の3行のコメント(#)を外してください
  # schedule:
  #   - cron: "0 9 * * 1,3,5"

permissions:
  contents: write

concurrency:
  group: generate-post
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HR_MODE: ${{ inputs.mode || 'auto' }}
      POST_FORMAT: ${{ inputs.format || 'reel' }}
      DESIGN_STYLE: ${{ inputs.design || 'auto' }}
      TOPIC: ${{ inputs.topic }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NOTE_URL: ${{ vars.NOTE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: FFmpeg と日本語フォント（Noto Sans/Serif CJK）をインストール
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra

      - name: Python パッケージをインストール
        run: pip install -r requirements.txt

      - name: 設定チェック
        run: python -m hideyoshi_reels check

      - name: 投稿を制作
        run: |
          if [ -n "$TOPIC" ]; then
            python -m hideyoshi_reels generate --topic "$TOPIC"
          else
            python -m hideyoshi_reels generate
          fi

      - name: A〜Dのデザインプレビューを作成
        if: inputs.preview_all
        run: |
          if [ -n "$TOPIC" ]; then
            python -m hideyoshi_reels preview --topic "$TOPIC"
          else
            python -m hideyoshi_reels preview
          fi

      - name: 完成した画像・動画をアップロード（Artifacts からダウンロード）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-${{ github.run_number }}
          path: output/
          retention-days: 30
          if-no-files-found: warn

      - name: 企画履歴とキャラクター素材をリポジトリに保存
        if: success() && (inputs.save_history || github.event_name == 'schedule')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json assets/character/expressions assets/character/reference || true
          if git diff --cached --quiet; then
            echo "保存する変更はありません"
            exit 0
          fi
          git commit -m "chore: 投稿制作の履歴を更新 (run ${{ github.run_number }})"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
