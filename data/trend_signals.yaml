# 以下は一般的な傾向にもとづく初期値（仮説）です。実績が出たら書き換えてください。
baseline_insights:
  - 1枚画像に情報を詰め込みすぎず、見出し＋3〜4項目のチェックリストにした投稿は保存されやすい傾向がある
  - 「〇〇選」「保存必須」「やってはいけない」など、数の約束や損失回避のフックは指が止まりやすい
  - 画像では要点だけを見せ、詳しい解説をキャプションに回すと滞在時間が伸びやすい
  - 同じキャラクター・同じ配色で統一すると、アカウントの認知につながりやすい
  - 受験生は「今日から何をすればいいか」が分かる行動ベースの投稿を保存しやすい
winning_patterns:
  - 上部の帯で対象者を指名（例「早稲田志望は〜」）→ 大見出し → チェックリスト → 保存の促し
  - 〇選ランキング形式で番号つきの短い項目を並べる
  - NG行動・やってはいけないことを警告色で見せる
  - 今すぐできる行動をチェックボックス付きで並べ、最後に「1つだけでもOK」と敷居を下げる
topic_ideas:
  - 時期別にやるべきこと（夏休み・直前期など）
  - 合格者の習慣・共通点
  - やってはいけない勉強法
  - 科目別の勉強のコツ（英語・国語・社会）
  - 学部選び・併願の考え方
