# モックモード（APIキー未設定時）で使う企画ネタ帳。
# 偏差値・倍率などの具体的な数値は、確認できていないため意図的に入れていません。
# 本番モード（ANTHROPIC_API_KEY 設定時）ではAIが毎回新しい企画を考えます。
topics:
  - title: 早稲田に受かる人の3つの共通点
    category: 合格者の特徴
    target: 早稲田志望の高校2〜3年生
    hook: 受かる人、実はここが違う
    value_points:
      - 過去問を早めに解いて「敵を知る」
      - 毎日の勉強量を記録して見える化
      - 苦手科目から逃げずに毎日少しでも触る
    retention_device: 3つ目が一番差がつくと予告する
    keywords: [合格者, 共通点, 過去問, 習慣]
    factual_claims: []
    problem: 同じくらい勉強しているのに、受かる人と落ちる人がおる。その差はどこじゃ？
    points:
      - まず一つ目。受かる者は過去問を早めに解いて、敵の正体を先に知っておる。
      - 二つ目。毎日の勉強時間と内容を記録して、サボりを見える化しておる。
      - そして三つ目が一番大事。苦手科目から逃げず、毎日少しでも触っておるのじゃ。
    telops: [受かる人の共通点, 差はどこ？, ①過去問を先に, ②記録で見える化, ③苦手から逃げない, 今日から真似じゃ]
    conclusion: 才能より習慣じゃ。今日から一つ真似してみよ。

  - title: 受験生がやりがちなNG勉強法
    category: やってはいけない勉強法
    target: 勉強しているのに成績が伸びない受験生
    hook: その勉強、時間のムダかも
    value_points:
      - きれいなノート作りに時間をかけすぎない
      - 解説を読んで分かったつもりで終わらない
      - 長時間だけを目標にしない
    retention_device: 最後にやるべき代わりの方法を出す
    keywords: [NG勉強法, ノート, 復習, 勉強時間]
    factual_claims: []
    problem: 毎日頑張っておるのに成績が上がらぬ。それはやり方が原因かもしれんぞ。
    points:
      - 一つ目。色ペンだらけのきれいなノート作り。書くだけで満足しておらぬか？
      - 二つ目。解説を読んで分かったつもり。自力で解き直さねば身につかぬ。
      - 三つ目。何時間やったかだけを目標にすること。大事なのは何ができるようになったかじゃ。
    telops: [NG勉強法3選, 伸びない原因は？, ①ノート作りすぎ, ②分かったつもり, ③時間だけ目標, 解き直しが最強]
    conclusion: 今日からは「解き直し」を中心にするのじゃ。

  - title: 早稲田志望が夏休みにやるべきこと
    category: 勉強計画
    target: 早稲田志望の高校3年生・浪人生
    hook: 夏で差がつくのはここじゃ
    value_points:
      - 英単語と文法の基礎を夏で固め切る
      - 志望学部の過去問を一度見て傾向を知る
      - 一日の勉強ルーティンを固定する
    retention_device: 最後に一番やってはいけないことを言う
    keywords: [夏休み, 計画, 基礎固め, ルーティン]
    factual_claims: []
    problem: 夏休みは長いようで一瞬じゃ。なんとなく過ごすと秋に焦ることになるぞ。
    points:
      - 一つ目。英単語と文法の基礎を夏のうちに固め切ること。
      - 二つ目。志望学部の過去問を一度見て、どんな問題が出るか知っておくこと。
      - 三つ目。起きる時間と勉強の順番を固定して、迷う時間をなくすことじゃ。
    telops: [夏にやること, 夏は一瞬じゃ, ①基礎を固め切る, ②過去問をのぞく, ③ルーティン固定, 計画を立てよ]
    conclusion: 夏を制する者が受験を制す。まずは計画表を作るのじゃ。

  - title: 早稲田受験あるある
    category: 受験あるある
    target: 早稲田を目指すすべての受験生
    hook: 早稲田志望なら絶対共感
    value_points:
      - 赤本の厚さに驚く
      - 学部が多くて併願に悩む
      - 大隈講堂の写真を待ち受けにしがち
    retention_device: 最後にあるあるから学べる対策を言う
    keywords: [あるある, 併願, 赤本, モチベーション]
    factual_claims: []
    problem: 早稲田を目指しておると、誰もが通る道があるのじゃ。
    points:
      - あるある一つ目。赤本を買って、その厚さに一瞬ひるむ。
      - 二つ目。学部が多すぎて、どこを併願するか毎晩悩む。
      - 三つ目。大隈講堂の写真を待ち受けにして気合を入れる。
    telops: [早稲田受験あるある, 共感したら保存, ①赤本の厚さ, ②併願に悩む, ③待ち受けが大隈講堂, 悩みは計画で解決]
    conclusion: 悩むのは本気の証じゃ。併願は早めに決めておくと楽になるぞ。

  - title: 偏差値が伸び悩んだ時の立て直し方
    category: 偏差値別勉強法
    target: 模試の結果が停滞している受験生
    hook: 成績が止まった時の処方箋
    value_points:
      - 模試の間違いを原因別に分ける
      - 新しい問題集より今の教材を完璧に
      - 一週間単位で小さな目標を立てる
    retention_device: 一番効く方法を最後に出す
    keywords: [偏差値, 停滞, 模試, 復習]
    factual_claims: []
    problem: 頑張っておるのに模試の成績が止まった。焦る気持ちはよう分かるぞ。
    points:
      - 一つ目。模試の間違いを、知識不足か、ケアレスミスか、時間不足かに分けよ。
      - 二つ目。新しい問題集に手を出さず、今の一冊を完璧にすることじゃ。
      - 三つ目。一週間ごとに小さな目標を立てて、できたらしっかり褒めるのじゃ。
    telops: [伸び悩み脱出法, 成績が止まった…, ①ミスを分類, ②一冊を完璧に, ③週ごとの目標, 停滞は伸びる前兆]
    conclusion: 停滞は伸びる直前によく起こるもの。やり方を整えて進むのじゃ。

  - title: 逆転合格を狙う人の勉強計画の立て方
    category: 逆転合格
    target: 今の成績から早稲田を目指す受験生
    hook: 逆転合格は計画で決まる
    value_points:
      - ゴールから逆算して月ごとの目標を決める
      - 英語を最優先で毎日やる
      - 予定は詰め込みすぎず予備日を作る
    retention_device: 計画が崩れた時の対処を最後に言う
    keywords: [逆転合格, 計画, 逆算, 英語]
    factual_claims:
      - 早稲田大学の多くの学部で英語は重要な科目とされている
    problem: 今の成績から早稲田を目指すなら、気合だけでは足りぬ。必要なのは作戦じゃ。
    points:
      - 一つ目。入試日から逆算して、月ごとに何を終わらせるか決めること。
      - 二つ目。英語は多くの学部で大事な科目と言われておる。毎日必ず触れるのじゃ。
      - 三つ目。予定は詰め込みすぎず、週に一日は予備日を作ること。崩れても立て直せるぞ。
    telops: [逆転合格の計画術, 気合だけはダメ, ①ゴールから逆算, ②英語は毎日, ③予備日を作る, 作戦が9割]
    conclusion: 天下統一も段取りが命じゃった。計画を立てた者が勝つのじゃ。

  - title: 早稲田の学部選びで後悔しないコツ
    category: 学部比較
    target: 学部選びに迷っている高校1〜2年生
    hook: 学部選び、名前で決めてない？
    value_points:
      - 学びたい内容をシラバスで確認する
      - 入試科目と配点を募集要項で確認する
      - オープンキャンパスや説明会で雰囲気を知る
    retention_device: 最後に一番見落としがちなポイントを出す
    keywords: [学部選び, 学部比較, 募集要項, オープンキャンパス]
    factual_claims:
      - 早稲田大学は学部ごとに入試科目や配点が異なる
    problem: 早稲田には学部がたくさんある。なんとなく選ぶと入学後に後悔するかもしれんぞ。
    points:
      - 一つ目。何を学べるかを、大学のシラバスや学部のページで確かめること。
      - 二つ目。学部によって入試の科目や配点が違う。最新の募集要項を必ず確認じゃ。
      - 三つ目。オープンキャンパスや説明会で、実際の雰囲気を感じることじゃ。
    telops: [学部選びのコツ, 名前で選ぶと危険, ①学ぶ内容を確認, ②科目と配点を確認, ③雰囲気を知る, 公式情報が一番]
    conclusion: 情報は必ず大学の公式サイトで確かめるのじゃ。それが後悔しない近道ぞ。

  - title: 集中力が続かない受験生へ
    category: 勉強法
    target: 勉強に集中できない高校生
    hook: 集中できないのは才能じゃない
    value_points:
      - スマホは物理的に別の部屋に置く
      - 時間を区切って短い休憩をはさむ
      - 始める作業を前日に決めておく
    retention_device: 最後に今すぐできる一手を出す
    keywords: [集中力, スマホ, 休憩, 習慣]
    factual_claims: []
    problem: 机に向かっても、気づけばスマホを触っておる。そんな自分を責めておらぬか？
    points:
      - 一つ目。スマホは別の部屋に置く。気合より環境じゃ。
      - 二つ目。時間を区切って、短い休憩をはさむこと。メリハリが集中を生むのじゃ。
      - 三つ目。明日最初にやる問題を、前の日に決めておくことじゃ。
    telops: [集中力の作り方, スマホ触りがち…, ①スマホは別室, ②時間を区切る, ③最初の一手を決める, 環境が9割]
    conclusion: 集中力は鍛えるより作るもの。今夜、明日の一問目を決めて寝るのじゃ。
