      kicker: 早稲田志望は**保存必須**
      title_top: 早稲田に受かる人の
      title_main: 共通点
      title_bottom: ""
      badge: 3選
      list_heading: この3つで差がつく
      items:
        - {text: "**過去問**を早めに解く", detail: 早い時期に過去問を見ると、何をどこまで勉強すればいいかが分かる。最初は解けなくてOK。, icon: book}
